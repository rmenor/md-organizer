    <rect x="0" y="0" width="96" height="120" rx="16" fill="#ff5f56" />
    <line x1="20" y1="6" x2="20" y2="114" stroke="#ffffff" stroke-opacity="0.45" stroke-width="6" stroke-linecap="round" />
    <rect x="30" y="98" width="54" height="12" rx="3" fill="#18191c" fill-opacity="0.75" />
    <text x="58" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">#</text>
  </g>

