<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Portada de El Arte del Código Limpio</title>
  <desc id="descripcion">Portada con un editor de código ordenado, nombres con significado y funciones pequeñas que representa los temas de El Arte del Código Limpio.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f4d55"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263b4a"/>
      <stop offset="1" stop-color="#15252f"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071015" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="720" height="720" fill="url(#fondo)"/>
  <circle cx="614" cy="112" r="176" fill="#78d6c4" opacity="0.14"/>
  <path d="M0 560 C150 492 252 632 390 548 S594 480 720 548 V720 H0Z" fill="#09171c" opacity="0.5"/>

  <g filter="url(#sombra)" transform="translate(82 188)">
    <rect width="556" height="282" fill="url(#panel)" stroke="#78d6c4" stroke-width="2"/>
    <rect width="556" height="42" fill="#10232c"/>
    <circle cx="25" cy="21" r="6" fill="#ef8b7a"/>
    <circle cx="47" cy="21" r="6" fill="#f5ca76"/>
    <circle cx="69" cy="21" r="6" fill="#78d6c4"/>
    <text x="102" y="27" fill="#a6b9c0" font-family="monospace" font-size="14">funciones_pequenas.md</text>
    <g font-family="monospace" font-size="20">
      <text x="32" y="86" fill="#78d6c4">01</text>
      <text x="32" y="122" fill="#78d6c4">02</text>
      <text x="32" y="158" fill="#78d6c4">03</text>
      <text x="32" y="194" fill="#78d6c4">04</text>
      <text x="32" y="230" fill="#78d6c4">05</text>
      <text x="78" y="86" fill="#f5ca76">function</text>
      <text x="190" y="86" fill="#f2f5f3">hacerPequeno</text>
      <text x="355" y="86" fill="#ef8b7a">(codigo) {</text>
      <text x="78" y="122" fill="#a9d8cf">  return</text>
      <text x="174" y="122" fill="#f2f5f3"> codigo</text>
      <text x="78" y="158" fill="#ef8b7a">}</text>
      <text x="78" y="194" fill="#f5ca76">function</text>
      <text x="190" y="194" fill="#f2f5f3">nombrarBien</text>
      <text x="350" y="194" fill="#ef8b7a">(idea) {</text>
      <text x="78" y="230" fill="#a9d8cf">  return</text>
      <text x="174" y="230" fill="#f2f5f3"> idea</text>
    </g>
  </g>

  <g fill="#f2f5f3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="360" y="88" font-size="17" letter-spacing="5" opacity="0.82">EJEMPLO DE LIBRO · INGENIERÍA DE SOFTWARE</text>
    <text x="360" y="530" font-size="43" font-weight="bold">El Arte del</text>
    <text x="360" y="572" font-size="43" fill="#78d6c4" font-weight="bold">Código Limpio</text>
  </g>
  <text x="360" y="620" fill="#d7e6e2" font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="middle" opacity="0.82">NOMBRES CON SIGNIFICADO · FUNCIONES PEQUEÑAS</text>
  <text x="360" y="660" fill="#d7e6e2" font-family="Georgia, 'Times New Roman', serif" font-size="14" text-anchor="middle" opacity="0.72">ADA LOVELACE &amp; MARTIN FOWLER</text>
</svg>
